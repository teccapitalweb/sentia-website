<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#081225">
<title>Verificar certificado · SENTIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0b1530;--navy-2:#13284a;--blue:#1b5df0;--blue-soft:#3f7bff;--ink:#13284a;--ink-soft:#5b6b86;--line:#e7ecf4;--ok:#2fbf2e;--bad:#ef4444}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#eaf2ff;background:#081225;background-image:radial-gradient(circle at 50% 6%,#102a52,#081225 60%)}
.card{width:100%;max-width:560px;background:#fff;color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy-2));padding:26px 28px;text-align:center;border-bottom:3px solid var(--blue)}
.top img{height:50px;width:auto;margin:0 auto 8px;display:block}
.top .sub{font-size:11px;letter-spacing:3px;color:var(--blue-soft);text-transform:uppercase;font-weight:700}
.body{padding:30px 28px 32px}
.state{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;margin-bottom:24px}
.state.ok{background:rgba(47,191,46,.1);border:1px solid rgba(47,191,46,.35)}
.state.bad{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35)}
.state.load{background:#eef3fb;border:1px solid #dde6f4}
.state__ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.state.ok .state__ic{background:var(--ok)}.state.bad .state__ic{background:var(--bad)}.state.load .state__ic{background:var(--blue)}
.state__ic svg{width:24px;height:24px}
.state__t{font-weight:800;font-size:17px;line-height:1.2}
.state.ok .state__t{color:var(--ok)}.state.bad .state__t{color:var(--bad)}
.state__d{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.rows{display:none}
.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);flex-shrink:0;padding-top:2px}
.row .v{font-size:15px;font-weight:600;color:var(--navy-2);text-align:right}
.row .v.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.foot{margin-top:22px;text-align:center;font-size:11px;color:var(--ink-soft);line-height:1.6}
.foot a{color:var(--blue);font-weight:700;text-decoration:none}
.buscar{padding:4px 2px 2px}
.buscar label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:9px}
.buscar__row{display:flex;gap:8px}
.buscar input{flex:1;height:46px;border:1px solid #d7deea;border-radius:10px;padding:0 13px;font:inherit;font-size:15px;color:var(--navy-2);text-transform:uppercase}
.buscar input:focus{outline:none;border-color:var(--blue)}
.buscar button{height:46px;padding:0 20px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer}
.buscar small{display:block;margin-top:9px;font-size:11.5px;color:var(--ink-soft)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<!-- MODIFICADO: sin PWA; el club vive en club.sentiamx.com -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SENTIA">
<link rel="icon" type="image/png" href="assets/icon-sentia.png">
</head>
<body>
<div class="card">
  <div class="top"><span style="font-family:'Sora','Inter',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:.02em;color:#ffffff">SEN<span style="color:#3f7bff">TIA</span></span><div class="sub">Verificación de Certificado</div></div>
  <div class="body">
    <div class="state load" id="state">
      <div class="state__ic"><svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div>
      <div><div class="state__t" id="st-title">Verificando…</div><div class="state__d" id="st-desc">Consultando el folio en la base de datos oficial.</div></div>
    </div>
    <!-- MODIFICADO: buscador de folio cuando se entra sin folio -->
    <form class="buscar" id="buscar" style="display:none">
      <label for="f-folio">Escribe el folio que aparece en el certificado</label>
      <div class="buscar__row">
        <input id="f-folio" placeholder="SENTIA-2026-000000" autocomplete="off" spellcheck="false">
        <button type="submit">Verificar</button>
      </div>
      <small>También puedes escanear el código QR del certificado.</small>
    </form>
    <div class="rows" id="rows">
      <div class="row"><span class="k">Nombre</span><span class="v" id="r-nombre">—</span></div>
      <div class="row"><span class="k">Curso</span><span class="v" id="r-curso">—</span></div>
      <div class="row"><span class="k">Área</span><span class="v" id="r-area">—</span></div>
      <div class="row"><span class="k">Carga académica</span><span class="v" id="r-horas">—</span></div>
      <div class="row"><span class="k">Fecha de emisión</span><span class="v" id="r-fecha">—</span></div>
      <div class="row"><span class="k">Folio</span><span class="v mono" id="r-folio">—</span></div>
    </div>
    <div class="foot">Certificado emitido digitalmente por <strong>SENTIA · IPCI Latinoamericano</strong><br><a href="https://www.sentiamx.com">www.sentiamx.com</a></div>
  </div>
</div>
<script>
/* MODIFICADO: si no viene folio, se muestra el buscador (no depende de Firebase) */
(function(){
  var f=(new URLSearchParams(location.search).get('folio')||new URLSearchParams(location.search).get('f')||'').trim();
  if(f) return;
  var st=document.getElementById('state');
  st.className='state load';
  st.querySelector('.state__ic').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.5-4.5"/></svg>';
  document.getElementById('st-title').textContent='Verifica un certificado';
  document.getElementById('st-desc').textContent='Escribe el folio del certificado para comprobar que es auténtico.';
  document.getElementById('rows').style.display='none';
  var b=document.getElementById('buscar'); b.style.display='block';
  b.addEventListener('submit',function(ev){ev.preventDefault();var v=document.getElementById('f-folio').value.trim().toUpperCase();if(v)location.search='?folio='+encodeURIComponent(v);});
  document.getElementById('f-folio').focus();
})();
</script>
<script type="module">
const params = new URLSearchParams(location.search);
const folio = (params.get('folio') || params.get('f') || '').trim().toUpperCase();
// En vista local consulta solo un webhook local. La página publicada usará
// Railway y nunca leerá Firestore directamente.
const WEBHOOK = location.hostname === 'localhost'
  ? 'http://localhost:8081'
  : 'https://sentia-academy-webhook-production.up.railway.app';
const $=id=>document.getElementById(id);
function setState(cls,svg,title,desc){const s=$('state');s.className='state '+cls;s.querySelector('.state__ic').innerHTML=svg;$('st-title').textContent=title;$('st-desc').textContent=desc;}
const OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>';
const BAD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
function fmt(d){try{const dt=d&&d.toDate?d.toDate():new Date(d);return dt.toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'});}catch(e){return d||'—';}}
(async()=>{
  if(!folio) return;   // MODIFICADO: lo atiende el buscador de abajo
  try{
    const r=await fetch(WEBHOOK+'/api/certificados/verificar?folio='+encodeURIComponent(folio),{headers:{'Accept':'application/json'}});
    const respuesta=await r.json().catch(()=>({}));
    if(r.status===404 || respuesta.estado==='no_encontrado'){setState('bad',BAD,'Certificado no encontrado','El folio '+folio+' no existe en nuestros registros.');return;}
    if(!r.ok) throw new Error(respuesta.error||'Error HTTP '+r.status);
    const data=respuesta.certificado;
    if(!respuesta.valid || data?.estado!=='vigente'){
      setState('bad',BAD,'Certificado no vigente','Este folio existe, pero su certificado fue '+(data?.estado||'invalidado')+'.');
      return;
    }
    setState('ok',OK,'Certificado auténtico','Este folio está registrado oficialmente por SENTIA.');
    $('r-nombre').textContent=data.alumno||'—';
    $('r-curso').textContent=data.curso||'—';
    $('r-area').textContent=data.area||'—';
    $('r-horas').textContent=(data.sesiones?data.sesiones+' sesiones · ':'')+(data.horas?data.horas+' horas':'—');
    $('r-fecha').textContent=fmt(data.emitidoEn);
    $('r-folio').textContent=data.folio||folio;
    $('rows').style.display='block';
  }catch(e){console.error(e);setState('bad',BAD,'Error de verificación','No se pudo consultar el folio. Intenta de nuevo más tarde.');}
})();
</script>
<script src="cookies.js" defer></script>
</body></html>
